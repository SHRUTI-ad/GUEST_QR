# Check-ins live in SQLite. On the free plan, disk is wiped on every deploy.
# To keep meal marks across redeploys: use a paid plan + Persistent Disk, then:
#   disks: mountPath /var/data
#   env DB_PATH=/var/data/guests.db
# During the event, prefer Admin → Reload Excel (no redeploy) for list updates.
services:
  - type: web
    name: guest-qr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: STAFF_USERNAME
        value: staff
      - key: STAFF_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Google Sheet check-in backup (Apps Script Web App URL)
      - key: CHECKIN_SHEET_WEBHOOK
        sync: false
      - key: CHECKIN_SHEET_SECRET
        sync: false
      # Set this only after attaching a Persistent Disk at /var/data
      # - key: DB_PATH
      #   value: /var/data/guests.db
