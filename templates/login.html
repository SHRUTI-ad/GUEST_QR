{% extends "base.html" %}
{% block title %}Staff login · {{ event_name }}{% endblock %}
{% block content %}
  <div class="topbar">
    <div>
      <p class="brand">Staff only</p>
      <h1>{{ event_name }}</h1>
      <p class="sub">Sign in to manage guests, send QR PDFs, and check in arrivals.</p>
    </div>
  </div>

  <div class="panel" style="max-width: 420px;">
    {% if error %}
      <div class="status-banner invalid">{{ error }}</div>
    {% endif %}
    <form method="post" class="form-row">
      <label>
        <span class="help">Username</span>
        <input type="text" name="username" value="staff" autocomplete="username" required />
      </label>
      <label>
        <span class="help">Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="help" style="margin-top: 1rem;">
      Default: <strong>staff</strong> / <strong>event123</strong>
    </p>
  </div>
{% endblock %}
